name: 🚀 기능 요청 · 추가 · 개선
description: 새 기능을 만들거나 있는 기능을 고칠 때
labels: ["기능"]
body:
  - type: markdown
    attributes:
      value: |
        제목에는 무엇을 하는지만 짧게 적어 주세요. 예) `Planner 도구 선택` · `/analyze 엔드포인트`
        파트(AI · DATA · AGENT · BE · FE · DOCS)와 담당자는 오른쪽에서 붙여 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 📝 현재 문제점
      description: 무엇이 부족하거나 불편한지, 왜 필요한지
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 🛠️ 해결 방안 · 제안 기능
      description: 어떻게 해결하고 무엇을 만들지
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ⚙️ 작업 내용
      description: 체크박스로 쪼개 두면 이슈에 진행률이 보여요
      value: |
        - [ ]
        - [ ]

  - type: textarea
    id: refs
    attributes:
      label: 📎 참고 자료
      description: 회의록, 개인 레포 링크, 논문, 캡처
