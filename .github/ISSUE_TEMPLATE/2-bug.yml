name: ❗ 버그
description: 의도와 다르게 동작하는 문제를 알릴 때
labels: ["버그"]
body:
  - type: markdown
    attributes:
      value: |
        제목에는 어디서 무슨 문제가 생기는지 적어 주세요. 예) `/analyze가 사진 5장 이상이면 멈춤`

  - type: textarea
    id: description
    attributes:
      label: 🗒️ 무슨 일이 생겼나
      description: 어느 기능 · 단계에서, 예상과 실제가 어떻게 다른지
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 재현 방법 (선택)
      value: |
        1.
        2.

  - type: textarea
    id: evidence
    attributes:
      label: 📸 로그 · 캡처 (선택)
      description: 고객 사진이 보이는 캡처는 올리지 마세요 (공개 레포)

  - type: input
    id: env
    attributes:
      label: ⚙️ 실행 환경 (선택)
      placeholder: 예) Windows 11 · GPU · torch x.y · transformers x.y
