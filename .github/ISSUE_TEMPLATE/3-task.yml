name: 🔧 작업
description: 설정 · 문서 · 리팩토링처럼 기능도 버그도 아닌 일
labels: ["작업"]
body:
  - type: markdown
    attributes:
      value: |
        제목에는 할 일을 짧게 적어 주세요. 예) `평가 세부 규칙 정리` · `README 실행법 추가`

  - type: textarea
    id: todo
    attributes:
      label: 📌 할 일
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]

  - type: textarea
    id: refs
    attributes:
      label: 📎 참고 자료
