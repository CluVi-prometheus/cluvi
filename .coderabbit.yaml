# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit 리뷰 설정
# - main으로 가는 PR을 한국어로 자동 리뷰합니다.
# - 머지 기준: CodeRabbit이 막을 지적(Request changes)을 남기면 고쳐야 하고,
#   지적이 해결되고 아래 사전 검사(제목 형식 · 민감정보)를 통과하면 CodeRabbit이 승인합니다.
#   main ruleset의 "승인 1명"은 CodeRabbit 승인 또는 팀원 승인 중 하나로 채워집니다.
# - 공개 레포라 CodeRabbit 오픈소스 플랜(무료)으로 동작합니다. 시간당 리뷰 횟수에 제한이 있습니다.
# - 다시 리뷰받기: PR 댓글에 "@coderabbitai review"

language: ko-KR
tone_instructions: "한국어로 짧고 구체적으로. 지적마다 근거(파일과 줄)와 고칠 방법을 한 줄로 붙이고, 사소한 취향 문제는 지적하지 마세요."

reviews:
  profile: chill
  auto_approvals:
    enabled: true
    # PR 작성자가 "@coderabbitai approve"로 스스로 승인시키는 것을 막습니다.
    allow_author_approval: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  fail_commit_status: true
  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:
    - label: 모델
      instructions: VLM 추론, 프롬프트, 토큰 선택, LoRA 학습, 평가 코드나 결과 비교를 바꿀 때
    - label: 데이터
      instructions: Hugging Face 데이터셋, 라벨, 데이터 분할, 전처리를 바꿀 때
    - label: 에이전트
      instructions: service/agent, service/tools 아래 Planner, Verifier, 도구를 바꿀 때
    - label: 서버
      instructions: service/api 아래 FastAPI 서버를 바꿀 때
    - label: 화면
      instructions: web/ 아래 상담원 화면을 바꿀 때
    - label: 문서
      instructions: README, docs/, 팀 약속 문서만 바꿀 때
    - label: 공통
      instructions: .github, 레포 설정처럼 여러 파트에 걸친 것을 바꿀 때
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "[WIP]"
  path_filters:
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/uv.lock"
  path_instructions:
    - path: "docs/agreements.md"
      instructions: |
        팀이 똑같이 맞추기로 확정한 것(백본, 데이터, 분할 train 881 · val 100 · test 185, 분석 카드 JSON, 평가지표 13개)을 적는 문서입니다.
        이 중 하나라도 바뀌면 "팀 합의가 필요한 변경"이라고 맨 앞에 분명히 적고, 무엇이 어떻게 바뀌는지 요약하세요.
        test는 최종 평가에만 쓰고 설정 · 임계값 · 체크포인트는 val로 고른다는 원칙을 어기는 내용이 있으면 지적하세요.
    - path: "experiments/**"
      instructions: |
        개인 레포 결과를 모아 비교하는 곳입니다. 다음을 확인하세요.
        - 숫자마다 개인 레포의 커밋이나 결과 파일 링크가 있는가
        - 평가셋 이름과 건수가 docs/agreements.md와 같은가 (val 100, test 185)
        - 지표 이름이 docs/agreements.md의 13개 정의와 같은가
        - 서로 다른 평가셋이나 설정의 점수를 같은 줄에서 비교하고 있지 않은가
    - path: "service/**"
      instructions: |
        에이전트 · 도구 · FastAPI 서버 코드입니다. 예외 처리, 외부 호출 타임아웃, 비밀값 하드코딩,
        고객 사진 경로나 리뷰 원문 같은 개인정보가 로그에 남는지를 중점적으로 보세요.
        출력은 docs/agreements.md 2절의 분석 카드 필드 이름과 값 목록을 따라야 합니다.
    - path: "web/**"
      instructions: |
        React + TypeScript 상담원 화면입니다. API 오류와 로딩 상태 표시, 접근성, 불필요한 리렌더링을 보세요.
    - path: ".github/**"
      instructions: |
        레포 운영 설정입니다. 이슈 폼과 release.yml이 쓰는 라벨 이름이 실제 레포 라벨
        (모델 · 데이터 · 에이전트 · 서버 · 화면 · 문서 · 공통 · 버그 · 작업 · 결정 필요)과 맞는지 확인하세요.
  pre_merge_checks:
    title:
      mode: error
      requirements: |
        PR 제목은 squash 머지 때 main에 남는 커밋 한 줄입니다. 형식은 `[파트] [유형] 작업 내용`입니다.
        - 파트는 AI, DATA, AGENT, BE, FE, DOCS, ALL 중 하나
        - 유형은 FEAT, FIX, DOCS, REFACTOR, CHORE 중 하나
        - 작업 내용은 무엇을 했는지 한 줄 (한국어 또는 영어)
        - 리뷰 전이면 맨 앞에 [WIP]를 붙여도 됩니다
        예) `[AGENT] [FEAT] Planner 도구 선택`, `[DOCS] [DOCS] 평가지표 정의 보완`
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: 공개 레포 민감정보
        mode: error
        instructions: |
          이 레포는 공개 레포입니다. 이 PR에서 추가되거나 바뀐 파일에 아래 중 하나라도 있으면 실패, 하나도 없으면 통과입니다.
          1. API 키, 액세스 토큰, 비밀번호 (예: hf_로 시작하는 Hugging Face 토큰, OpenAI · Anthropic 키, 개인 액세스 토큰)
          2. .env 파일 (.env.example처럼 값이 비어 있는 예시 파일은 허용)
          3. 고객이 올린 리뷰 사진이나 데이터셋 이미지, 리뷰 원문을 대량으로 담은 데이터 파일 (문서용 다이어그램, 로고, 화면 캡처는 허용)
          4. 모델 가중치 · 체크포인트 파일 (.safetensors, .bin, .pt, .pth, .ckpt, .gguf)
          5. 출력 셀이 남아 있는 Jupyter 노트북 (.ipynb)
          실패하면 해당 파일과 이유를 적어 주세요.

chat:
  auto_reply: true
